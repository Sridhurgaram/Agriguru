<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Farmer Portal</title>
  <style>

    .video-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #eef6f2;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #2e7d32;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      max-width: 500px;
      margin: 30px auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      color: #2d6a4f;
      text-align: center;
    }

    label {
      margin-top: 15px;
      display: block;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    .btn {
      margin-top: 20px;
      width: 100%;
      padding: 10px;
      background-color: #2e7d32;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn:hover {
      background-color: #1d6c21;
    }

    .tab-container {
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
      gap: 10px;
    }

    .tab-btn {
      width: 120px;
      padding: 10px;
      background-color: #d8f3dc;
      border: 1px solid #95d5b2;
      cursor: pointer;
      text-align: center;
      border-radius: 5px;
    }

    .active {
      background-color: #2e7d32;
      color: white;
    }

    .form-container {
      display: none;
    }

    .visible {
      display: block;
    }

    .phone-verify-container {
      position: relative;
    }

    .phone-verify-container input {
      padding-right: 80px;
    }

    .verify-text {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      color: #2e7d32;
      font-size: 14px;
      cursor: pointer;
      text-decoration: underline;
      font-weight: bold;
    }

    .verify-text:hover {
      color: #1b611e;
    }
  </style>
  
</head>
<body>
  
   <video class="video-bg" autoplay muted loop>
    <source src="static/grass.mp4" type="video/mp4" />
    Your browser does not support the video tag.
  </video>

  <header>
    <h1>Farmer Portal</h1>
  </header>

  <main>
    <div class="tab-container">
      <div class="tab-btn active" onclick="switchTab('register')">Register</div>
      <div class="tab-btn" onclick="switchTab('login')">Login</div>
    </div>

    <!-- Register Form -->
    <div id="register" class="form-container visible">
      <h2>Register</h2>

      <label for="name">Farmer Name</label>
      <input type="text" id="name" placeholder="Enter name">

      <label for="aadhaar">Aadhaar Number</label>
      <input type="text" id="aadhaar" placeholder="Enter Aadhaar number">

      <label for="location">Location</label>
      <input type="text" id="location" placeholder="Enter location">

      <label for="phone">Phone Number</label>
      <div class="phone-verify-container">
        <input type="text" id="phone" placeholder="Enter 10-digit phone">
        <span class="verify-text" onclick="verifyPhone()">Verify</span>
      </div>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password">

      <label for="repassword">Re-enter Password</label>
      <input type="password" id="repassword" placeholder="Re-enter password">

      <button class="btn" onclick="registerFarmer()">Register</button>
    </div>

    <!-- Login Form -->
    <div id="login" class="form-container">
      <h2>Login</h2>

      <label for="login-phone">Phone Number</label>
      <input type="text" id="login-phone" placeholder="Enter phone">

      <label for="login-password">Password</label>
      <input type="password" id="login-password" placeholder="Enter password">

      <button class="btn" onclick="loginFarmer()">Login</button>
    </div>
  </main>

  <script>
    function switchTab(tab) {
      document.getElementById("register").classList.remove("visible");
      document.getElementById("login").classList.remove("visible");
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

      document.getElementById(tab).classList.add("visible");
      document.querySelectorAll('.tab-btn')[tab === 'register' ? 0 : 1].classList.add('active');
    }

    let phoneVerified = false;

    async function verifyPhone() {
      const phone = document.getElementById("phone").value.trim();
      if (!/^\d{10}$/.test(phone)) return alert("⚠️ Invalid 10-digit phone number");

      const verifyBtn = document.querySelector('.verify-text');
      verifyBtn.innerText = "Sending...";
      verifyBtn.style.pointerEvents = "none";

      try {
        const res = await fetch("/send_otp", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone })
        });

        const data = await res.json();
        verifyBtn.innerText = "Verify";
        verifyBtn.style.pointerEvents = "auto";

        if (data.success) {
          const promptMsg = data.dev_mode 
            ? `✅ OTP generated (${data.dev_otp}). Enter it to verify:`
            : `✅ OTP sent to ${phone}. Enter it:`;
          const otp = prompt(promptMsg);
          if (!otp) return alert("OTP not entered.");

          const verifyRes = await fetch("/verify_otp", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phone, otp })
          });

          const result = await verifyRes.json();
          if (result.verified) {
            phoneVerified = true;
            verifyBtn.innerText = "Verified ✔";
            verifyBtn.style.color = "#1b5e20";
            alert("✅ Phone verified successfully!");
          } else {
            alert("❌ Invalid OTP: " + (result.error || ""));
          }
        } else {
          alert("❌ Failed to send OTP: " + (data.error || ""));
        }
      } catch (err) {
        alert("❌ Error: " + err.message);
        verifyBtn.innerText = "Verify";
        verifyBtn.style.pointerEvents = "auto";
      }
    }

    async function registerFarmer() {
      const name = document.getElementById("name").value.trim();
      const aadhaar = document.getElementById("aadhaar").value.trim();
      const location = document.getElementById("location").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value;
      const repassword = document.getElementById("repassword").value;

      if (!name || !location || !phone || !password || !repassword)
        return alert("⚠️ Please fill in all required fields.");

      if (!/^\d{10}$/.test(phone)) return alert("⚠️ Invalid 10-digit phone number.");
      if (password !== repassword) return alert("⚠️ Passwords do not match.");
      if (password.length < 6) return alert("⚠️ Password must be at least 6 characters.");

      try {
        const res = await fetch("/register_farmer", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, aadhaar, location, phone, password })
        });

        const result = await res.json();
        if (result.success) {
          alert("🎉 Farmer Registered Successfully! Please login.");
          switchTab('login');
          document.getElementById("login-phone").value = phone;
        } else {
          alert("❌ Registration failed: " + (result.error || ""));
        }
      } catch (err) {
        alert("❌ Network error: " + err.message);
      }
    }

    async function loginFarmer() {
      const phone = document.getElementById("login-phone").value.trim();
      const password = document.getElementById("login-password").value;

      if (!/^\d{10}$/.test(phone)) return alert("⚠️ Invalid 10-digit phone number.");
      if (!password) return alert("⚠️ Enter your password.");

      try {
        const res = await fetch("/login_farmer", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone, password })
        });

        const result = await res.json();
        if (result.success) {
          localStorage.setItem('agriguru_user', JSON.stringify(result.user));
          alert("✅ Logged in successfully! Redirecting to Advisory Dashboard...");
          window.location.href = "/chatbot";
        } else {
          alert("❌ Login failed: " + (result.error || ""));
        }
      } catch (err) {
        alert("❌ Network error: " + err.message);
      }
    }
  </script>

</body>
</html>
